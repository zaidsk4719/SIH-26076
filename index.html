    <script>
      // Filter benign Vite websocket disconnection errors in AI Studio iframe environment
      (function () {
        var _err = console.error;
        console.error = function () {
          var msg = arguments[0];
          if (typeof msg === 'string' && (msg.indexOf('[vite] failed to connect to websocket') !== -1 || msg.indexOf('[vite]') === 0)) {
            return;
          }
          _err.apply(console, arguments);
        };
      })();
    </script>
